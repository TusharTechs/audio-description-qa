[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-description-qa"
version = "0.1.0"
description = "Quality checks for machine-written audio description"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Tushar Agarwal" }]
keywords = ["audio-description", "accessibility", "blind", "a11y", "video"]
classifiers = [
  "Intended Audience :: Developers",
  "Topic :: Multimedia :: Video",
  "Topic :: Adaptive Technologies",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = ["numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/TusharTechs/audio-description-qa"
Source = "https://github.com/TusharTechs/audio-description-qa"

[tool.setuptools]
packages = ["adqa"]
